<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kavidu & Sanji | Guest Admin</title><link rel="stylesheet" href="styles.css"><style>
.admin-wrap{max-width:900px;margin:auto;padding:35px 18px 70px}.admin-card{background:#fffdf9;border:1px solid #fff;border-radius:18px;padding:clamp(18px,4vw,36px);margin:18px 0;box-shadow:0 12px 35px #62594b12}.admin-wrap h1{font:400 clamp(38px,7vw,56px)/1.1 var(--serif);text-align:center}.admin-wrap h2{font:500 27px var(--serif)}.admin-wrap input{display:block;width:100%;padding:13px;margin:8px 0;border:1px solid #ded5cc;border-radius:9px;font:inherit;background:white}.admin-wrap button{cursor:pointer}.msg{min-height:22px;font-size:13px}.error{color:#a34b55}.success{color:#4e7657}.notice{padding:13px;background:#f4e9df;border-radius:10px;font-size:12px}.guest-row{display:grid;grid-template-columns:55px 1fr 75px auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee5dc;font-size:13px}.mini{border:0;border-radius:20px;padding:8px 11px;background:#e8eee5}.del{background:#f5e1e3}.linkbox{overflow-wrap:anywhere;background:#e8eee5;padding:12px;border-radius:10px;margin-top:10px}@media(max-width:600px){.guest-row{grid-template-columns:35px 1fr 60px}.guest-row button{font-size:11px}.guest-row .edit,.guest-row .delete{grid-row:2}}
</style></head><body><main class="admin-wrap"><p class="eyebrow" style="text-align:center">KAVIDU & SANJI · PRIVATE AREA</p><h1>Guest Manager</h1>
<section id="loginCard" class="admin-card"><h2>Admin login</h2><p class="notice">Enter the admin password to manage guest invitations.</p><form id="loginForm"><input id="password" type="password" placeholder="Admin password" autocomplete="current-password" required><button class="button button-primary" type="submit">Log in</button></form><p id="loginMessage" class="msg" aria-live="polite"></p></section>
<section id="manager" hidden><div class="admin-card"><h2>Add or update guest</h2><form id="guestForm"><input id="guestId" placeholder="Guest ID (example: 003)" required><input id="guestName" placeholder="Guest full name" required><input id="guestTable" placeholder="Table number (example: 4)"><button class="button button-primary" type="submit">Save guest</button><button id="clearForm" class="button button-outline" type="button">Clear</button></form><p id="formMessage" class="msg" aria-live="polite"></p><div id="guestLink" class="linkbox" hidden></div></div>
<div class="admin-card"><h2>Guest list <span id="count"></span></h2><p class="notice">Changes are saved in this browser. To publish them for everyone, download guests.js and replace the old file in your GitHub repository.</p><div id="list"></div><p><button id="download" class="button button-primary" type="button">Download guests.js</button> <button id="view" class="button button-outline" type="button">View invitation</button> <button id="logout" class="button button-outline" type="button">Log out</button></p></div></section></main>
<script src="guests.js"></script><script>
(function(){
'use strict';
var ADMIN_PASSWORD='KaviSanji2027', STORE='KaviSanjiGuestsV3';
function el(id){return document.getElementById(id)}
var loginCard=el('loginCard'),manager=el('manager'),password=el('password'),loginMessage=el('loginMessage'),formMessage=el('formMessage'),guestId=el('guestId'),guestName=el('guestName'),guestTable=el('guestTable'),guestLink=el('guestLink'),list=el('list');
var guests={};
try{var saved=localStorage.getItem(STORE);guests=saved?JSON.parse(saved):JSON.parse(JSON.stringify(typeof GUESTS!=='undefined'?GUESTS:{}));}catch(e){guests=JSON.parse(JSON.stringify(typeof GUESTS!=='undefined'?GUESTS:{}));}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(guests));}catch(e){setMessage(formMessage,'Could not save in this browser. Check browser storage settings.','error');}}
function setMessage(node,text,cls){node.textContent=text;node.className='msg '+(cls||'');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function render(){var ids=Object.keys(guests).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});});el('count').textContent='('+ids.length+')';if(!ids.length){list.innerHTML='<p>No guests added yet.</p>';return;}list.innerHTML=ids.map(function(id){var g=guests[id]||{};return '<div class="guest-row"><b>'+esc(id)+'</b><span>'+esc(g.name||'Unnamed')+'</span><span>Table '+esc(g.table||'—')+'</span><button type="button" class="mini edit" data-edit="'+esc(id)+'">Edit</button><button type="button" class="mini del delete" data-delete="'+esc(id)+'">Delete</button></div>';}).join('');}
function showManager(){loginCard.hidden=true;manager.hidden=false;render();}
el('loginForm').addEventListener('submit',function(e){e.preventDefault();if(password.value===ADMIN_PASSWORD){sessionStorage.setItem('ksAdminLoggedIn','yes');setMessage(loginMessage,'','');showManager();}else{setMessage(loginMessage,'Incorrect password. Check capital letters and try again.','error');password.focus();}});
el('guestForm').addEventListener('submit',function(e){e.preventDefault();var id=guestId.value.trim(),name=guestName.value.trim(),table=guestTable.value.trim();if(!id||!name){setMessage(formMessage,'Please enter both Guest ID and Guest Name.','error');return;}guests[id]={name:name,table:table};persist();render();var base=window.location.href.split('?')[0].replace(/admin\.html$/,'');var url=base+'?guest='+encodeURIComponent(id);guestLink.hidden=false;guestLink.textContent='Personal invitation link: '+url;var copy=document.createElement('button');copy.type='button';copy.className='mini';copy.textContent='Copy link';copy.addEventListener('click',function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){setMessage(formMessage,'Guest saved and invitation link copied.','success');}).catch(function(){setMessage(formMessage,'Guest saved. Copy the link shown above manually.','success');});}else{setMessage(formMessage,'Guest saved. Copy the link shown above manually.','success');}});guestLink.appendChild(document.createElement('br'));guestLink.appendChild(copy);setMessage(formMessage,'Guest saved in this browser. Download guests.js to publish.','success');guestId.value='';guestName.value='';guestTable.value='';});
el('clearForm').addEventListener('click',function(){guestId.value='';guestName.value='';guestTable.value='';guestLink.hidden=true;setMessage(formMessage,'','');});
list.addEventListener('click',function(e){var id=e.target.getAttribute('data-edit');if(id!==null){var g=guests[id]||{};guestId.value=id;guestName.value=g.name||'';guestTable.value=g.table||'';guestName.focus();return;}id=e.target.getAttribute('data-delete');if(id!==null&&window.confirm('Delete guest '+id+'?')){delete guests[id];persist();render();setMessage(formMessage,'Guest deleted in this browser. Download guests.js to publish.','success');}});
el('download').addEventListener('click',function(){var content='// Replace this file in your GitHub repository to publish guest updates.\nconst GUESTS = '+JSON.stringify(guests,null,2)+';\n';var blob=new Blob([content],{type:'text/javascript'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='guests.js';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);setMessage(formMessage,'Downloaded guests.js. Replace the old file in GitHub and commit the change.','success');});
el('view').addEventListener('click',function(){window.location.href='index.html';});el('logout').addEventListener('click',function(){sessionStorage.removeItem('ksAdminLoggedIn');window.location.reload();});
if(sessionStorage.getItem('ksAdminLoggedIn')==='yes')showManager();
})();
</script></body></html>
